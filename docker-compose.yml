version: '3.8'

services:
  postgres-db:
    image: postgres:15-alpine
    container_name: hotelhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: hotelHub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotelhub-network

  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter
    container_name: hotelhub-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:1234@postgres-db:5432/hotelHub?sslmode=disable"
    ports:
      - "9187:9187"
    networks:
      - hotelhub-network
    depends_on:
      - postgres-db

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hotelhub_rabbitmq
    command: /bin/sh -c "rabbitmq-plugins enable rabbitmq_prometheus && rabbitmq-server"
    ports:
      - "5672:5672"
      - "15672:15672"
      - "15692:15692"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    networks:
      - hotelhub-network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: hotelhub-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - hotelhub-network

  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:latest
    container_name: hotelhub-es-exporter
    command: --es.uri=http://elasticsearch:9200
    ports:
      - "9114:9114"
    networks:
      - hotelhub-network
    depends_on:
      - elasticsearch

  redis-cache:
    image: redis:7-alpine
    container_name: hotelhub-redis
    ports:
      - "6379:6379"
    networks:
      - hotelhub-network

  prometheus:
    image: prom/prometheus:latest
    container_name: hotelhub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - hotelhub-network
    restart: unless-stopped
    depends_on:
      - hotelhub-app

  grafana:
    image: grafana/grafana:latest
    container_name: hotelhub-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - hotelhub-network
    restart: unless-stopped

  hotelhub-app:
    build: .
    container_name: hotelhub-backend
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/hotelHub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_DATA_REDIS_HOST: redis-cache
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,prometheus"
      MANAGEMENT_ENDPOINT_PROMETHEUS_ENABLED: "true"
    networks:
      - hotelhub-network
    depends_on:
      - postgres-db
      - redis-cache
      - rabbitmq
      - elasticsearch

networks:
  hotelhub-network:
    driver: bridge

volumes:
  postgres_data:
  es_data: