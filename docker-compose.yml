version: '3.8'

services:

  postgres-db:
    image: postgres:15-alpine
    container_name: hotelhub-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: hotelHub
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hotelhub-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: hotelhub_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
    networks:
      - hotelhub-network


  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: hotelhub-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false # Lokal testlerde sertifika hatalarıyla uğraşmamak için geçici kapattık
      - ES_JAVA_OPTS=-Xms512m -Xmx512m # Bilgisayarının RAM'ini sömürmemesi için sınır koyduk
    ports:
      - "9200:9200" # Java projemizin arama/sorgu için konuşacağı ana kapı
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - hotelhub-network

  hotelhub-app:
    build: .
    container_name: hotelhub-backend
    ports:
      - "8080:8080"
    depends_on:
      - postgres-db
      - rabbitmq
      - elasticsearch # Uygulama ayağa kalkmadan önce ES'in hazır olmasını dikte ettik
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/hotelHub
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      # Uygulama container içinden ES'e bağlansın diye URL'ini tanımladık
      SPRING_ELASTICSEARCH_URIS: http://elasticsearch:9200
    networks:
      - hotelhub-network

networks:
  hotelhub-network:
    driver: bridge

volumes:
  postgres_data:
  es_data: # Elasticsearch verilerinin silinmemesi için kalıcı disk alanı